# =============================================================================
# ATLAS — configuración de la cartera multi-sleeve
# =============================================================================
# ÚNICA fuente de parámetros ajustables. El código NO debe contener números de
# negocio: si hay que tocar un umbral, se toca aquí. Ver 27_SCALPING/04.
#
# Cambiar este fichero NO requiere recompilar; el loader valida al arrancar y
# aborta con un error explícito si algo está fuera de rango (sleeveConfig.ts).
# =============================================================================

version: 1

# Modo de operación. "demo" es el único permitido en Fase 1.
# Pasar a "real" exige aprobación explícita + revisión legal (restricción dura).
modo: demo

# -----------------------------------------------------------------------------
# TAREA 1 — Asignación de margen entre sleeves
# -----------------------------------------------------------------------------
cartera:
  # Reparto del margen. Debe sumar exactamente 1.0 (el loader lo verifica).
  margen_por_sleeve:
    core: 0.40
    intradia: 0.30
    eventscalp: 0.30

  # El margen de un sleeve en reposo NO se reasigna: queda como colchón.
  # Poner esto a `true` violaría la Tarea 1; el loader lo rechaza.
  reasignar_margen_ocioso: false

  # Prohibido apalancar la cartera para aprovechar margen libre.
  apalancar_margen_libre: false

  # Regla de solapamiento: nunca dos sleeves con posición en el MISMO
  # instrumento y la MISMA dirección. Si ocurre, se cierra la del sleeve
  # de menor prioridad.
  #
  # [!] LECTURA DEL PROMPT ("orden: C > B > A"): se interpreta como el orden en
  #     que se CIERRAN — EventScalp primero, Core el último y por tanto el más
  #     protegido. Es la lectura económicamente sensata (no se sacrifica la
  #     posición estratégica por un scalp de evento). Si la intención era la
  #     contraria, invertir esta lista es el único cambio necesario.
  prioridad_cierre: [eventscalp, intradia, core]

  # Circuit breakers de CARTERA (Tarea 5). Fracción sobre el equity total.
  #
  # Subidos el 2026-08-17 a petición explícita de Moisés: "no te frenes por el
  # riesgo aunque se pierda, son pruebas". Con 100 € por operación sobre 8 537 €
  # (1,17% cada una), los valores anteriores (2% día / 5% semana) paraban el bot
  # tras DOS pérdidas y no dejaban acumular muestra suficiente para medir nada.
  #
  # Siguen existiendo a propósito: son la diferencia entre una demo que se puede
  # analizar y una cuenta a cero. Con 6% diario caben ~5 pérdidas seguidas.
  # ESTOS NÚMEROS SON DE DEMO. En real hay que volver a 2%/5%.
  #
  # 2026-09-07 — subidos otra vez, y esta vez es ARITMÉTICA OBLIGADA, no una
  # preferencia: el objetivo pedido es 3-5 operaciones diarias arriesgando 200 €
  # cada una. Cinco entradas son 1 000 € = 12,3% del equity (8 146 €). Con el
  # breaker en 6% el bot se pararía a la tercera entrada del día y nunca llegaría
  # a las cinco — el techo tiene que quedar POR ENCIMA del presupuesto diario o
  # el presupuesto no significa nada.
  #
  # Lo que esto significa sin adornos: un día entero en contra pasa a costar
  # -12,3% de la cuenta, y el breaker semanal deja pasar casi dos de esos días.
  # El drawdown ya medido ANTES de este cambio fue del 16,1%. Es un número de
  # DEMO y solo se sostiene porque el dinero es virtual.
  breakers:
    perdida_diaria_pct: 0.13 # -13% en el día -> pausa TODA la cartera hasta mañana
    perdida_semanal_pct: 0.22 # -22% en la semana -> pausa semanal

# -----------------------------------------------------------------------------
# TAREA 5 — Límites regulatorios ESMA (España)
# -----------------------------------------------------------------------------
# Apalancamiento máximo por clase de activo. Se verifica el NOCIONAL de CADA
# orden contra el capital del sleeve. Los dos primeros valores vienen fijados
# por el prompt; el resto son los tramos publicados por ESMA y quedan aquí
# como ajustables porque el Sleeve A opera índices, petróleo y gas.
esma:
  apalancamiento_max:
    fx_mayor: 30 # 1:30 — divisas mayores (dato del prompt)
    fx_menor: 20 # 1:20 — divisas no mayores
    oro: 20 # 1:20 — oro (dato del prompt)
    indice_mayor: 20 # 1:20 — índices bursátiles principales
    indice_menor: 10 # 1:10 — índices secundarios
    materia_prima: 10 # 1:10 — materias primas distintas del oro (petróleo, gas)
    cripto: 2 # 1:2  — criptomonedas

  # Clasificación de cada instrumento operable. La clave es el símbolo de Deriv.
  # Si un símbolo NO aparece aquí, el gate RECHAZA la orden (fallo seguro:
  # nunca se asume un apalancamiento permisivo por defecto).
  #
  # Verificado contra la cuenta demo VRTC4942159 el 2026-08-11 en DOS pasos,
  # porque no son lo mismo:
  #   `npm run sonda:universo`     -> ¿hay histórico de precios?
  #   `npm run sonda:operabilidad` -> ¿acepta Deriv una orden real?
  #
  # [!] Tener datos NO implica poder operar. Estos devuelven velas diarias
  #     perfectas y aun así Deriv responde "Trading is not offered for this
  #     asset" al pedir una proposal de Multipliers, así que quedan FUERA:
  #       frxNZDUSD, frxXPTUSD (platino), frxXPDUSD (paladio),
  #       frxBROUSD (Brent),
  #       OTC_SPC, OTC_NDX, OTC_DJI, OTC_GDAXI, OTC_FTSE, OTC_N225 (índices).
  #
  #     Los ÍNDICES bursátiles son solo feed de precios en la API nativa: se
  #     confirma la nota previa de 27_SCALPING y SIGUE EN PIE el bloqueante de
  #     MT5/VPS Windows si se quieren operar índices.
  #
  # Universo operable: 13 instrumentos.
  clase_por_simbolo:
    # FX mayores (6 — NZD/USD no se ofrece)
    frxEURUSD: fx_mayor
    frxGBPUSD: fx_mayor
    frxUSDJPY: fx_mayor
    frxUSDCHF: fx_mayor
    frxAUDUSD: fx_mayor
    frxUSDCAD: fx_mayor
    # FX cruces (3)
    frxEURGBP: fx_menor
    frxEURJPY: fx_menor
    frxGBPJPY: fx_menor
    # Metales (2 — platino y paladio no se ofrecen)
    frxXAUUSD: oro
    frxXAGUSD: materia_prima
    # Cripto (2)
    cryBTCUSD: cripto
    cryETHUSD: cripto
    # Índices vía IG (2). En Deriv daban precio pero RECHAZABAN la orden
    # (medido 2026-08-11); en IG son operables y se verificaron contra la cuenta
    # demo Z6DHEP el 2026-08-13. Sin esta clasificación el gate los rechaza por
    # diseño: nunca se asume un apalancamiento permisivo por defecto.
    US30: indice_mayor
    NASDAQ: indice_mayor

# -----------------------------------------------------------------------------
# TAREA 5 — Riesgo común a los tres sleeves
# -----------------------------------------------------------------------------
riesgo:
  # Riesgo por operación como fracción del CAPITAL DEL SLEEVE (no del total).
  riesgo_por_trade_pct:
    # Subido de 0.25-0.50% a 0.50-1.00% el 2026-08-13, a petición explícita:
    # estamos en DEMO y hace falta que la muestra de operaciones sea grande y
    # significativa. Con 0.25% muchas señales generaban posiciones tan pequeñas
    # que el resultado quedaba dentro del ruido. NO subir esto en real sin
    # rehacer el walk-forward: dobla el drawdown esperado.
    # 2026-09-07: max sube a 2,5% para que el rango sea COHERENTE con el riesgo
    # fijo de 200 € (2,46% del equity). Mientras riesgo_fijo_por_operacion > 0
    # este rango no se usa; existe como red por si se vuelve al modo porcentaje.
    min: 0.005 # 0.50%
    max: 0.025 # 2.50%

  # ---------------------------------------------------------------------------
  # Presupuesto de riesgo DIARIO por tipo de estrategia (fracción del equity).
  # Decidido por Moisés el 2026-08-17: repartir el riesgo por estrategia, no
  # solo por operación. Es el total que cada bloque puede poner en juego en una
  # jornada; agotado, ese bloque no vuelve a entrar hasta mañana.
  #
  # ADVERTENCIA MEDIDA, no opinión: estos niveles son ~4x los que validó el
  # walk-forward (0,5-1,0% por operación). Multiplican el drawdown esperado en
  # la misma proporción; NO multiplican el retorno. El techo medido de esta
  # estrategia fue ~7% anual, no 10-30% mensual. Son válidos para DEMO, donde el
  # objetivo es acumular muestra rápido y medir acertividad. Antes de tocar
  # dinero real hay que rehacer el walk-forward con estos números.
  # ---------------------------------------------------------------------------
  #
  # 2026-09-07 — subidos para permitir 3-5 operaciones diarias de 200 €.
  # La cuenta es el motivo, no una corazonada: con 2,5% (203 €) solo cabía UNA
  # entrada de 200 € al día en scalping, y con 2,0% (163 €) el Core no cabía
  # NI UNA. Repartido ahora como 3 entradas de scalping + 2 de Core = 5 al día.
  presupuesto_diario_pct:
    scalping: 0.075 # 7,5% ~ 611 € ~ 3 entradas de 200 € — intradía y eventscalp
    semanal: 0.05 # 5,0% ~ 407 € ~ 2 entradas de 200 € — sleeve core

  # Tope de riesgo VIVO simultáneo por bloque. Un bloque es un grupo de cosas
  # que se mueven juntas: la divisa (EUR, USD...), el oro y los índices. Impide
  # que tres posiciones distintas sean en el fondo la misma apuesta.
  # Subido de 2% a 8% el 2026-08-17: con 100 € por operación (1,17% del equity),
  # el 2% dejaba entrar UNA sola posición por bloque y bloqueaba el resto — no
  # protegía, impedía probar. Con 8% caben ~6 posiciones del mismo bloque.
  # Subido de 8% a 15% el 2026-09-07: con 200 € por operación (2,46% del
  # equity), el 8% dejaba entrar 3 posiciones por bloque contando las del Core
  # que ya están abiertas. Con 15% caben ~6.
  tope_por_bloque_pct: 0.15 # 15,0% del equity ~ 1 222 € ~ 6 entradas de 200 €

  # Riesgo FIJO por operación, en moneda de cuenta (EUR). Decisión de Moisés
  # 2026-08-17: "arriesga 100 buscando 300-500".
  #
  # Cuando está puesto, manda sobre los porcentajes de arriba: cada entrada
  # arriesga esta cantidad, ni más ni menos, y el tamaño se calcula para que así
  # sea. Ponerlo a 0 vuelve al reparto por porcentaje.
  #
  # Con 8 538 € en cuenta, 100 € es el 1,17% por operación. Sigue por debajo del
  # tope por bloque (2%), así que dos posiciones correlacionadas ya no caben:
  # es intencionado.
  # Subido de 100 a 125 el 2026-08-17 por decisión de Moisés. El motivo es
  # concreto y medido: con 100 € el US30 se quedaba a 21 € de poder entrar
  # —su stop diario cuesta 103 £ (~121 €)— y quedaba fuera de la prueba.
  # Subido de 125 a 200 el 2026-09-07 por decisión de Moisés: "riesgo de 200,
  # beneficio 500". Sobre 8 146 € son el 2,46% por operación — el doble de lo
  # que validó el walk-forward (0,5-1,0%) y, por tanto, esperando el doble de
  # drawdown. No multiplica el retorno: multiplica la varianza.
  riesgo_fijo_por_operacion: 200

  # Techo absoluto por operación, en moneda de cuenta.
  #
  # Existe para un caso concreto: hay instrumentos cuyo LOTE MÍNIMO ya cuesta
  # más que el riesgo fijo, y no se pueden operar más pequeños. El NASDAQ es
  # uno: su lote mínimo (0,5) con stop diario arriesga ~220 £ (~257 €). Moisés
  # lo aprobó el 2026-08-17 para que entre en la prueba.
  #
  # Cuando pasa eso se opera al lote mínimo —lo más pequeño que existe— siempre
  # que no supere este techo. Nunca por encima: el techo es lo que impide que
  # "el mínimo del bróker" se convierta en una excusa para cualquier cifra.
  #
  # 260 € sobre 8 536 € es el 3,0% en UNA operación. Es mucho, y es a propósito
  # porque esto es demo y el objetivo es acumular muestra. En real este número
  # baja a la vez que `riesgo_fijo_por_operacion`.
  # Subido de 260 a 300 el 2026-09-07 al pasar el riesgo fijo a 200 €. Solo
  # afecta a instrumentos cuyo lote mínimo arriesga más de 200 € (el NASDAQ:
  # ~257 €). No se sube más porque nada del universo actual lo necesita, y 300 €
  # ya son el 3,7% de la cuenta en UNA sola operación.
  riesgo_maximo_por_operacion: 300

  # Objetivo en múltiplos de R (R = lo que arriesgas). Con 8, arriesgar 100 €
  # busca 800 €. Decisión de Moisés 2026-08-17: "100 buscando 1000, 800 o 400".
  # Cambiar este número es lo único que hace falta: 10 -> 1 000 €, 4 -> 400 €.
  #
  # El objetivo viaja CON la orden como limit del bróker: si el proceso muere,
  # la toma de beneficio sigue puesta en IG.
  #
  # SIN VALIDAR, y conviene saber en qué dirección: un objetivo ALTO encaja
  # mejor con seguir tendencias que uno bajo —dejar correr al ganador es de
  # donde sale el dinero—, pero la mayoría de operaciones NO llegarán a 8R. Se
  # gana poco y muchas veces, se pierde 100 € muchas más veces, y el resultado
  # depende de que los pocos aciertos grandes lleguen. Es lo que mide la demo.
  #
  # 2026-09-07: bajado de 8R a 2,5R por decisión de Moisés — "riesgo 200,
  # beneficio 500" es exactamente 2,5R (200 x 2,5 = 500).
  #
  # AVISO, y va en dirección contraria a lo que parece: esto NO hace el sistema
  # más rentable, le cambia la forma. El Core es seguimiento de tendencia y ahí
  # el dinero sale de dejar correr al ganador; cortando en 2,5R se cobran más
  # objetivos (se toca 2,5R mucho más a menudo que 8R) pero se renuncia a la
  # operación grande que paga las muchas pérdidas pequeñas. Es medible: con el
  # registro de cierres arreglado, cuatro semanas de demo lo dicen.
  objetivo_r: 2.5

  # Rechazar cualquier señal si el spread supera este múltiplo del spread
  # normal del activo. Aplica a los tres sleeves.
  spread_max_x_normal: 1.5

  # Nº de observaciones de spread necesarias para considerar fiable la línea
  # base. Con menos, el gate rechaza por falta de referencia (fallo seguro).
  spread_muestras_minimas: 30

# -----------------------------------------------------------------------------
# TAREA 2 — Sleeve A "Core" (Trend + Carry), horizonte semanal
# -----------------------------------------------------------------------------
core:
  activo: true
  revision: semanal

  limites:
    # Es una cartera de tendencia diversificada, así que admite muchas
    # posiciones a la vez. El tope existe para que un fallo de datos no abra
    # los 23 instrumentos de golpe.
    posiciones_max: 12
    # Tope por CLASE de activo ESMA. Sin él, corto EUR/USD + largo USD/JPY +
    # largo USD/CHF + largo USD/CAD son la misma apuesta (largo dólar) contada
    # cuatro veces: cada una pasa el gate con su 0,5% y el conjunto queda
    # concentrado sin que ningún límite proteste.
    posiciones_max_por_clase: 4

  trend:
    activo: true
    # Señal: "ewma" (cruce 50/100/200) o "donchian" (ruptura de canal).
    metodo: ewma
    ewma_periodos: [50, 100, 200]
    donchian_periodo: 100
    atr_periodo: 14
    atr_mult_stop: 2

  carry:
    # [!] DESACTIVADO: Deriv no publica diferenciales de swap por API y la
    #     investigación previa lo dejó "sin confirmar" (00_INDICE_MAESTRO).
    #     No se opera carry sobre datos inventados. Activar solo cuando exista
    #     una fuente de swaps verificada.
    activo: false
    pares_long: 3
    pares_short: 3
    rebalanceo: mensual

  # Vol-target 10% anualizado: si la volatilidad realizada supera el objetivo,
  # se reduce el tamaño proporcionalmente (nunca se aumenta por encima de 1x).
  vol_target:
    activo: true
    objetivo_anual: 0.10
    ventana_dias: 60
    escala_maxima: 1.0

# -----------------------------------------------------------------------------
# TAREA 3 — Sleeve B "Intradía" (Breakout + volumen), horizonte diario
# -----------------------------------------------------------------------------
intradia:
  activo: true

  limites:
    # 2026-09-07: subidos para sostener el objetivo de 3-5 operaciones diarias.
    # El intradía es el único sleeve que puede darlas: el Core revisa una vez al
    # día por diseño y el EventScalp depende de que haya dato macro.
    posiciones_max: 4
    posiciones_max_por_clase: 2
    trades_dia_max: 4
    trades_dia_min_objetivo: 1
    trades_semana_max: 20
    # Si los TRES primeros trades del día son perdedores, el sleeve para el día.
    # Era 2, pero con 200 € por operación dos pérdidas seguidas cerraban la
    # jornada en la segunda entrada y nunca se llegaba a las 3-5 pedidas.
    # Con 3 el corte sigue existiendo: -600 € = -7,4% del equity.
    parar_tras_perdidas_iniciales: 3
    # Un solo intento por setup; sin reentrada al mismo nivel el mismo día.
    reentrada_mismo_setup: false

  # Confirmación de FUERZA de la ruptura.
  #
  # [!] SUSTITUYE A LA CONFIRMACIÓN DE VOLUMEN, y no por comodidad. Medido
  #     contra la cuenta demo el 2026-08-11 (`npm run sonda:volumen`): Deriv
  #     emite ticks a CADENCIA FIJA de 1 por segundo. EUR/USD, oro y BTC dan
  #     estadísticas idénticas (media 59 ticks/min, máx exactamente 60, misma
  #     dispersión). El recuento de ticks no contiene información sobre
  #     participación, así que "volumen > 1.5x la media" nunca dispararía.
  #
  #     Se mide en su lugar la EXPANSIÓN DE RANGO: que el recorrido de la vela
  #     que rompe supere 1.5x el recorrido medio de esa MISMA hora en jornadas
  #     anteriores. Responde a la misma pregunta que el filtro de volumen
  #     —¿hay fuerza real detrás de esta ruptura?— con un dato que en Deriv sí
  #     es real. Comparar contra la misma hora sigue siendo imprescindible: la
  #     apertura de Londres siempre tiene más recorrido que la madrugada.
  fuerza:
    multiplo_minimo: 1.5 # recorrido > 1.5x el medio de la MISMA hora
    ventana_media_dias: 20 # días de histórico para esa media horaria
    muestras_minimas: 10 # con menos histórico, no se opera (fallo seguro)

  entradas:
    # 1) ORB — ruptura del rango de apertura
    orb:
      activo: true
      minutos_rango: 30 # rango de apertura: primeros 15-30 min
      sesiones: [londres, ny]
    # 2) Ruptura del rango de la sesión previa, con retest del nivel roto
    rango_previo:
      activo: true
      exigir_retest: true
      retest_tolerancia_atr: 0.25
    # 3) Breakout de máximos/mínimos de 1-4 h en activos con ATR creciente
    breakout_horario:
      activo: true
      ventana_horas: 4
      exigir_atr_creciente: true

  salidas:
    stop_atr_min: 0.5
    stop_atr_max: 1.0
    # TP >= 0.8x el stop medio para que la expectancy sea positiva con el
    # win rate de diseño (65-75%). El win rate es CONSECUENCIA, no objetivo.
    tp_x_stop: 1.0

    # Stop a punto de equilibrio (2026-09-07, petición de Moisés: "que el
    # scalping trabaje con breakeven"). Cuando la operación gana lo que
    # arriesgaba (1R = 200 €), el stop sube al precio de entrada y esa
    # operación ya no puede terminar en pérdida.
    #
    # QUÉ CUESTA, que no es gratis: también corta ganadoras que solo estaban
    # respirando: un retroceso normal hasta la entrada ahora cierra la posición
    # en plano en vez de dejarla seguir. En scalping —objetivo cercano, TP ~ 1x
    # el stop— compensa; en el Core NO se activa por eso mismo.
    #
    # offset_r deja el stop un poco a favor en lugar de clavado en la entrada:
    # con 0 se paga igual la comisión de cierre y la operación "sin pérdida"
    # acaba costando dinero. 0,1R = 20 € de colchón sobre un riesgo de 200 €.
    breakeven:
      activo: true
      activar_en_r: 1.0 # a +200 € de beneficio vivo, stop a la entrada
      offset_r: 0.1 # +0,1R por encima de la entrada, para cubrir el cierre

  # No operar en los ±N minutos alrededor de un evento de alto impacto:
  # ese territorio es del Sleeve C.
  exclusion_eventos_min: 15

  sesiones:
    londres: { abre: "07:00", cierra: "16:00" } # UTC
    ny: { abre: "12:00", cierra: "21:00" } # UTC

# -----------------------------------------------------------------------------
# TAREA 4 — Sleeve C "EventScalp" (Noticias macro)
# -----------------------------------------------------------------------------
eventscalp:
  activo: true

  limites:
    posiciones_max: 2
    posiciones_max_por_clase: 1
    eventos_dia_max: 2
    eventos_semana_max: 5
    trades_por_evento: 1
    # Si coinciden dos eventos de alto impacto, no operar ninguno.
    no_operar_si_coinciden: true
    coincidencia_ventana_min: 30
    # Breaker propio: -2% del capital del sleeve -> para.
    breaker_perdida_sleeve_pct: 0.02

  # Solo eventos de alto impacto (3 estrellas). Cualquier otro se ignora.
  eventos_permitidos: [CPI, NFP, FOMC, ECB, BOE, PIB, PMI_FLASH]
  impacto_minimo: 3

  entrada:
    # Ventana de entrada tras la publicación.
    espera_min_seg: 60
    espera_max_seg: 120
    # Condición 1: el spread volvió a <= 1.5x el normal (usa riesgo.spread_max_x_normal)
    # Condición 2: el momentum confirma la dirección en los primeros 15-30 s.
    momentum_ventana_seg: 30
    momentum_min_atr: 0.3

  salidas:
    stop_atr: 0.5
    tp_r: 1.2

    # Breakeven del EventScalp. El umbral es MÁS BAJO que en el intradía a
    # propósito: aquí el objetivo está en 1,2R, así que esperar a 1R dejaría la
    # regla sin margen para actuar. A 0,6R ya hay recorrido que proteger.
    breakeven:
      activo: true
      activar_en_r: 0.6
      offset_r: 0.1

  # Puntuación de la sorpresa (actual vs consenso). La IA PUNTÚA; el motor
  # DECIDE con estas reglas. La IA nunca opera sola.
  sorpresa:
    # Desvío RELATIVO mínimo del dato respecto al consenso para operar.
    # 0.05 = el dato se aparta un 5% del consenso (p. ej. IPC 3,15% frente a
    # un consenso de 3,00%). Las sorpresas macro reales se mueven en el rango
    # 3-10% relativo; un umbral del 50% exigiría un dato histórico y dejaría
    # al sleeve sin operar nunca — y sin alcanzar los 20 eventos que pide el
    # criterio de paso de Fase 1. Calibrar con los datos de la demo.
    puntuacion_minima: 0.05
    # Fuente del calendario económico. "manual" lee los eventos de
    # `eventos_programados` (suficiente para las 4 semanas de demo).
    # Un proveedor de API real se añadirá cuando se decida cuál.
    fuente: manual
    eventos_programados: []

# -----------------------------------------------------------------------------
# TAREA 7 — Modo demo y criterios de paso (Fase 1)
# -----------------------------------------------------------------------------
fase1:
  semanas_demo: 4
  criterios:
    core:
      expectancy_min: 0 # > 0 tras costes
      drawdown_max_cartera: 0.10
    intradia:
      expectancy_min: 0
      profit_factor_min: 1.3
      trades_minimos: 40
      drawdown_max_cartera: 0.10
    eventscalp:
      expectancy_min: 0
      profit_factor_min: 1.3
      eventos_minimos: 20
